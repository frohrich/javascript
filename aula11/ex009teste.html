<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício sobre Pais</title>
</head>
<body>
    <h1>Sistema de nacionalidade</h1>
    Qual seu pais: <input type="text" id="txtpais">
    <input type="button" value="Verificar" onclick="testar()">
    <div id="res">

    </div>

    <script>
        function testar() {
            let pais = document.querySelector('#txtpais').value
            let res = document.querySelector('#res')
            if (pais.toUpperCase == 'BRASIL' ) {
                res.innerHTML = `Você é Brasileiro!`
            } else {
                res.innerHTML = `Você é Estrangeiro`
            }
        }
    </script>
</body>
</html>
