<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <style>
        body {
            font: normal 20pt Arial;
        }

        div#area {
            background: rgb(15, 70, 15);
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Digite números</h1>
    <input type="number" name="txtn1" id="txtn1">
    <input type="number" name="txtn2" id="txtn2">
    <input type="button" value="Somar" onclick="somar()">
    <div id="res"></div>
    <div id="area">Interaja...</div>
    <script>
        let s = 0

        function somar() {
            let tn1 = document.querySelector('#txtn1')
            let tn2 = document.querySelector('#txtn2')
            let res = document.querySelector('#res')

            let n1 = Number(tn1.value)
            let n2 = Number(tn2.value)

            s = n1 + n2
            res.innerHTML = `Resultado: ${s}`
        }

        let a = document.querySelector('#area')
        a.addEventListener ('mouseenter', entrar)
        a.addEventListener ('mouseout', sair)
        a.addEventListener ('click', clicar)

        function entrar() {
            a.innerText = 'Clique'
            a.style.background = 'blue'
        }

        function sair() {
            a.innerText = 'Intereja...'
            a.style.background = 'rgb(15, 70, 15)'
        }

        function clicar() {
            a.innerText = `Resultado é ${s}`
            a.style.background = 'red'
        }
    </script>
</body>
</html>
