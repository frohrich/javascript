<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Investimento</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #dbe3ee;
      --success: #0f766e;
      --danger: #b91c1c;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .container {
      width: min(100%, 560px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    p.subtitle {
      margin: 0 0 24px;
      color: var(--muted);
    }

    form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 11px 12px;
      font-size: 1rem;
    }

    input:focus {
      outline: 2px solid #bfdbfe;
      border-color: #93c5fd;
    }

    button {
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      font-weight: 700;
      color: white;
      background: var(--primary);
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .hidden {
      display: none;
    }

    .alert {
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--danger);
      min-height: 1.2em;
    }

    .result {
      line-height: 1.7;
      font-size: 1.1rem;
    }

    .result strong {
      color: var(--success);
    }

    .back-btn {
      margin-top: 20px;
      background: #475569;
    }

    .back-btn:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <main class="container">
    <section id="screen-form">
      <h1>Simulador de Investimento</h1>
      <p class="subtitle">Preencha os dados para calcular o valor com juros compostos.</p>

      <form id="investment-form">
        <div class="field">
          <label for="name">Nome</label>
          <input id="name" name="name" type="text" placeholder="Digite seu nome" required>
        </div>

        <div class="field">
          <label for="monthly">Mensalidade (R$)</label>
          <input id="monthly" name="monthly" type="number" step="0.01" min="0.01" placeholder="Ex.: 20" required>
        </div>

        <div class="field">
          <label for="years">Tempo de contribuição (anos)</label>
          <input id="years" name="years" type="number" min="1" step="1" placeholder="Ex.: 2" required>
        </div>

        <button id="simulate-btn" type="submit">Simular</button>
      </form>
      <div class="alert" id="error"></div>
    </section>

    <section id="screen-result" class="hidden">
      <h1>Resultado da Simulação</h1>
      <p class="result" id="result-text"></p>
      <button class="back-btn" id="back-btn" type="button">Fazer nova simulação</button>
    </section>
  </main>

  <script>
    const INTEREST_RATE = 0.00517; // 0,517% ao mês

    const brlFormatter = new Intl.NumberFormat('pt-BR', {
      style: 'currency',
      currency: 'BRL'
    });

    const form = document.getElementById('investment-form');
    const formScreen = document.getElementById('screen-form');
    const resultScreen = document.getElementById('screen-result');
    const resultText = document.getElementById('result-text');
    const errorEl = document.getElementById('error');
    const simulateBtn = document.getElementById('simulate-btn');
    const backBtn = document.getElementById('back-btn');

    function showError(message) {
      errorEl.textContent = message;
    }

    function clearError() {
      errorEl.textContent = '';
    }

    function goToResult() {
      formScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
    }

    function goToForm() {
      resultScreen.classList.add('hidden');
      formScreen.classList.remove('hidden');
    }

    backBtn.addEventListener('click', goToForm);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearError();
      simulateBtn.disabled = true;

      const name = document.getElementById('name').value.trim();
      const monthly = Number(document.getElementById('monthly').value);
      const years = Number(document.getElementById('years').value);
      const months = years * 12;

      if (!name || monthly <= 0 || years <= 0 || !Number.isFinite(monthly) || !Number.isFinite(years)) {
        showError('Preencha todos os campos com valores válidos.');
        simulateBtn.disabled = false;
        return;
      }

      const expression = `${monthly} * (((1 + ${INTEREST_RATE}) ^ ${months} - 1) / ${INTEREST_RATE})`;

      try {
        const response = await fetch('http://api.mathjs.org/v4/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ expr: expression })
        });

        if (!response.ok) {
          throw new Error('Falha ao consultar a API de cálculo.');
        }

        const contentType = response.headers.get('content-type') || '';
        let parsedResult;

        if (contentType.includes('application/json')) {
          const data = await response.json();
          parsedResult = Number(data.result);
        } else {
          const rawResult = await response.text();
          parsedResult = Number(rawResult.trim());
        }

        if (!Number.isFinite(parsedResult)) {
          throw new Error('A API retornou um valor inválido.');
        }

        resultText.innerHTML = `Olá <strong>${name}</strong>, juntando <strong>${brlFormatter.format(monthly)}</strong> todo mês, você terá <strong>${brlFormatter.format(parsedResult)}</strong> em <strong>${years} ${years === 1 ? 'ano' : 'anos'}</strong>.`;

        goToResult();
      } catch (error) {
        showError(error.message || 'Não foi possível concluir a simulação.');
      } finally {
        simulateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
